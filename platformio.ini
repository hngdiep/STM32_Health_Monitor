[platformio]
default_envs = bluepill_f103c8
src_dir = app/src

[env:bluepill_f103c8]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
upload_protocol = stlink
extra_scripts = pre:freertos_build.py
build_flags =
    -D STM32F10X_MD
    -D USE_STDPERIPH_DRIVER
    -I config
    -I app/inc
    -I drivers/inc
    -I Libraries/CMSIS/CM3/CoreSupport
    -I Libraries/CMSIS/CM3/DeviceSupport/ST/STM32F10x
    -I Libraries/STM32F10x_StdPeriph_Driver/inc
    -I middlewares/FreeRTOS-Kernel/include
    -I middlewares/FreeRTOS-Kernel/portable/GCC/ARM_CM3
    